version: "3.7"
services:
  joppekoers.nl:
    container_name: joppekoers.nl
    restart: unless-stopped
    build:
      context: .
      target: app
    volumes:
      - ./backend/projects:/app/backend/projects
      - ./backend/media:/app/backend/media
      - ./backend/uploads:/app/backend/uploads
    environment:
      - PORT=8080
    ports:
      - 8080:8080
