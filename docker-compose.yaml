version: "3.7"
services:
  frontend:
    container_name: frontend
    restart: unless-stopped
    build:
      context: .
      target: frontend
    volumes:
      - ./frontend/static/uploads:/app/frontend/static/uploads
    environment:
      - PORT=8080
      - CMS_URL=http://localhost:1337
      - CMS_INTERNAL_URL=http://cms:1337
    ports:
      - 8080:8080
  cms:
    container_name: cms
    restart: unless-stopped
    build:
      context: .
      target: cms
    volumes:
      - ./cmsj/projects:/app/projects
      - ./cmsj/media:/app/media
    environment:
      - PORT=1337
      - CMS_URL=http://localhost:1337
    ports:
      - 1337:1337
