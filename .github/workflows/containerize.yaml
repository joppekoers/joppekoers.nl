name: Containerize

on:
  push:
    branches:
      - main
      - hotfix/*

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_APP: ghcr.io/${{ github.repository }}/app

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Package Registry
        uses: docker/login-action@v2.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # can be removed if the user is the owner of the repository and the repository name are lowercase
      - name: Set lower case owner name
        run: |
          echo "IMAGE_NAME_APP=${IMAGE_NAME_APP,,}" >>${GITHUB_ENV}
        env:
          IMAGE_NAME_APP: "${{ env.IMAGE_NAME_APP }}"

      - name: Build and push app
        uses: docker/build-push-action@v4
        with:
          context: .
          target: app
          push: true
          tags: ${{ env.IMAGE_NAME_APP }}

      - name: Trigger Watchtower update
        run: |
          curl --fail --silent --show-error --max-time 300 -H "Authorization: Bearer ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}" "${{ secrets.WATCHTOWER_URL }}/v1/update"
