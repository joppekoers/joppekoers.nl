version: '3.7'
services:
  joppekoers.nl:
    container_name: joppekoers.nl
    image: ghcr.io/joppekoers/joppekoers.nl/app:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    volumes:
      - ./cdn:/app/cdn
      - ./cache:/app/cache
      - ./backend/media:/app/backend/media
      - ./backend/uploads:/app/backend/uploads
    environment:
      - PROJECTS_DIR=/app/cdn/projectImg
      - CACHE_DIR=/app/cache
      - CDN_REPO_DIR=/app/cdn
      - SYNC_TOKEN=${SYNC_TOKEN:?SYNC_TOKEN must be set}
    ports:
      - 8080:8080

  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_ROLLING_RESTART=true
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:?WATCHTOWER_HTTP_API_TOKEN must be set}
    ports:
      - 127.0.0.1:8081:8080
